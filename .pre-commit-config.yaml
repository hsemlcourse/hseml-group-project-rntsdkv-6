repos:
  - repo: local
    hooks:
      # Кастомный хук для очистки output'ов в .ipynb
      - id: clean-notebooks
        name: Clean Jupyter outputs
        entry: bash pre-commit
        language: system
        stages: [pre-commit]
        files: \.ipynb$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Сортировка импортов
      - id: ruff
        args: [--select, I, --fix]
      # Форматирование кода
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Проверка на trailing whitespace
      - id: trailing-whitespace
      # Проверка на пустые строки в конце файла
      - id: end-of-file-fixer
        exclude: \.ipynb$
      # Проверка YAML синтаксиса
      - id: check-yaml
      # Проверка JSON синтаксиса
      - id: check-json
